<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Client Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <nav class="navbar">
    <div class="container navbar-inner">
      <a href="index.html" class="brand">
        <span class="brand-logo"></span>
        Myhublogistic
      </a>
      <div class="nav-links">
        <a href="#" onclick="switchTab('shipments');return false;">Shipments</a>
        <a href="#" onclick="switchTab('invoices');return false;">Invoices</a>
        <a href="#" onclick="switchTab('profile');return false;">Profile</a>
        <a href="#" onclick="logout();return false;">Logout</a>
      </div>
    </div>
  </nav>

  <div class="container section">
    <div id="tab-shipments" class="tab-content">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">
          <h3 style="margin:0;">Your Shipments</h3>
          <a class="btn btn-primary" href="client-create-shipment.html">New Shipment</a>
        </div>
        <div id="msgShipments"></div>
        <div class="table-wrap" style="margin-top:10px;">
          <table id="shipmentsTable">
            <thead>
              <tr>
                <th>ID</th><th>Tracking #</th><th>Origin</th><th>Destination</th><th>Status</th><th>Created</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>

    <div id="tab-invoices" class="tab-content" style="display:none;">
      <div class="card">
        <h3>Your Invoices</h3>
        <div id="msgInvoices"></div>
        <div class="table-wrap">
          <table id="invoicesTable">
            <thead>
              <tr>
                <th>ID</th><th>Amount</th><th>Status</th><th>Due Date</th><th>Created</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>

    <div id="tab-profile" class="tab-content" style="display:none;">
      <div class="card">
        <h3>Edit Profile</h3>
        <div id="msgProfile"></div>
        <form id="profileForm" class="grid-2">
          <div class="form-group">
            <label>Name</label>
            <input class="form-control" type="text" id="p_name" required />
          </div>
          <div class="form-group">
            <label>Company</label>
            <input class="form-control" type="text" id="p_company" />
          </div>
          <div class="form-group">
            <label>Phone</label>
            <input class="form-control" type="text" id="p_phone" />
          </div>
          <div class="form-actions" style="grid-column:1/-1;">
            <button class="btn btn-primary" type="submit">Save Changes</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="assets/app.js"></script>
  <script>
    requireClient();
    const msgShipments = document.getElementById("msgShipments");
    const msgInvoices = document.getElementById("msgInvoices");
    const msgProfile = document.getElementById("msgProfile");
    const shipmentsTbody = document.querySelector("#shipmentsTable tbody");
    const invoicesTbody = document.querySelector("#invoicesTable tbody");

    function switchTab(name){
      document.querySelectorAll(".tab-content").forEach(el=>el.style.display="none");
      document.getElementById("tab-"+name).style.display = "";
    }

    async function loadShipments(){
      shipmentsTbody.innerHTML = "";
      try {
        const data = await apiRequest("/client/shipments");
        (data.shipments||[]).forEach(s => {
          shipmentsTbody.appendChild(el("tr",{},[
            el("td",{textContent:s.id}),
            el("td",{textContent:s.tracking_number||"-"}),
            el("td",{textContent:s.origin||"-"}),
            el("td",{textContent:s.destination||"-"}),
            el("td",{textContent:s.status||"-"}),
            el("td",{textContent:new Date(s.created_at).toLocaleString()})
          ]));
        });
      } catch(err) {
        showMsg(msgShipments, "Failed to load shipments: " + (err.data?.detail||err.message), "error");
      }
    }

    async function loadInvoices(){
      invoicesTbody.innerHTML = "";
      try {
        const data = await apiRequest("/client/invoices");
        (data.invoices||[]).forEach(inv => {
          invoicesTbody.appendChild(el("tr",{},[
            el("td",{textContent:inv.id}),
            el("td",{textContent:"$"+ (inv.amount_cents/100).toFixed(2)}),
            el("td",{textContent:inv.status}),
            el("td",{textContent:inv.due_date?new Date(inv.due_date).toLocaleDateString():"-"}),
            el("td",{textContent:new Date(inv.created_at).toLocaleString()})
          ]));
        });
      } catch(err) {
        showMsg(msgInvoices, "Failed to load invoices: " + (err.data?.detail||err.message), "error");
      }
    }

    async function loadProfile(){
      const u = getUser();
      if(!u) return;
      document.getElementById("p_name").value = u.name || "";
      document.getElementById("p_company").value = u.company_name || "";
      document.getElementById("p_phone").value = u.phone || "";
    }

    document.getElementById("profileForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      msgProfile.innerHTML = "";
      const payload = {
        name: document.getElementById("p_name").value.trim(),
        company_name: document.getElementById("p_company").value.trim(),
        phone: document.getElementById("p_phone").value.trim()
      };
      try {
        await apiRequest("/client/profile", {method:"PUT", body:JSON.stringify(payload)});
        const u = getUser();
        setUser({...u, ...payload});
        showMsg(msgProfile, "Profile updated.", "success");
      } catch(err) {
        showMsg(msgProfile, "Update failed: " + (err.data?.detail||err.message), "error");
      }
    });

    loadShipments();
    loadInvoices();
    loadProfile();
  </script>
</body>
</html>
