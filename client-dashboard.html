<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <nav class="navbar">
    <div class="container navbar-inner">
      <a href="index.html" class="brand">
        <span class="brand-logo"></span>
        Myhublogistic
      </a>
      <div class="nav-links">
        <a href="client-dashboard.html">Dashboard</a>
        <a href="client-customers.html">Customers</a>
        <a href="client-orders.html">Orders</a>
        <a href="client-shipments.html">Shipments</a>
        <a href="#" onclick="logout();return false;">Logout</a>
      </div>
    </div>
  </nav>

  <div class="container section">
    <div class="card">
      <h3>Welcome, <span id="userName"></span></h3>
      <p style="color:var(--text-dim);font-size:14px;margin:0 0 16px;">
        Overview of your logistics data.
      </p>
      <div class="stats-grid">
        <div class="stat-card"><div class="label">Customers</div><div class="value" id="statCustomers">-</div></div>
        <div class="stat-card"><div class="label">Orders</div><div class="value" id="statOrders">-</div></div>
        <div class="stat-card"><div class="label">Shipments</div><div class="value" id="statShipments">-</div></div>
        <div class="stat-card"><div class="label">In Transit</div><div class="value" id="statInTransit">-</div></div>
      </div>
      <div class="form-actions">
        <a class="btn btn-primary" href="client-customers.html">Manage Customers</a>
        <a class="btn btn-glass" href="client-orders.html">Manage Orders</a>
        <a class="btn btn-glass" href="client-shipments.html">Manage Shipments</a>
      </div>
    </div>
  </div>

  <script src="assets/app.js"></script>
  <script>
    requireAuth();
    const user = getUser();
    document.getElementById("userName").textContent = user?.name || "Client";

    async function loadStats(){
      try {
        const [customers, orders, shipments] = await Promise.all([
          apiRequest("/customers"),
          apiRequest("/orders"),
          apiRequest("/shipments")
        ]);
        document.getElementById("statCustomers").textContent = customers.length;
        document.getElementById("statOrders").textContent = orders.length;
        document.getElementById("statShipments").textContent = shipments.length;
        document.getElementById("statInTransit").textContent = shipments.filter(s=>s.status==="in_transit").length;
      } catch(err) {
        console.error("Failed to load stats", err);
      }
    }
    loadStats();
  </script>
</body>
</html>
