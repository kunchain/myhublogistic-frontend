<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin – DB View</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <nav class="navbar">
    <div class="container navbar-inner">
      <a href="index.html" class="brand">
        <span class="brand-logo"></span>
        Myhublogistic
      </a>
      <div class="nav-links">
        <a href="admin-users.html">Users</a>
        <a href="admin-db-view.html">DB View</a>
        <a href="#" onclick="logout();return false;">Logout</a>
      </div>
    </div>
  </nav>

  <div class="container section">
    <div class="card">
      <h3>Database Viewer</h3>
      <p style="color:var(--text-dim);font-size:13px;">Select a table and click Load to run SELECT *.</p>
      <div id="msgDb"></div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
        <select id="tableSelect" class="form-control" style="width:220px;">
          <option value="users">users</option>
          <option value="companies">companies</option>
          <option value="shipments">shipments</option>
          <option value="invoices">invoices</option>
          <option value="payments">payments</option>
        </select>
        <button class="btn btn-primary" id="loadBtn">Load</button>
      </div>
    </div>

    <div class="card" style="margin-top:20px;">
      <h3>Results</h3>
      <div class="table-wrap">
        <table id="dbTable">
          <thead></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="assets/app.js"></script>
  <script>
    requireAdmin();
    const msgDb = document.getElementById("msgDb");
    const tableSelect = document.getElementById("tableSelect");
    const loadBtn = document.getElementById("loadBtn");
    const thead = document.querySelector("#dbTable thead");
    const tbody = document.querySelector("#dbTable tbody");

    loadBtn.addEventListener("click", async () => {
      msgDb.innerHTML = "";
      thead.innerHTML = "";
      tbody.innerHTML = "";
      const table = tableSelect.value.trim();
      if(!table) return;

      try {
        // This expects a backend endpoint: GET /admin/db/:table that returns {columns:[...], rows:[...]}
        const data = await apiRequest("/admin/db/" + encodeURIComponent(table));
        const cols = data.columns || [];
        const rows = data.rows || [];

        if(!cols.length) {
          showMsg(msgDb, "No columns returned.", "error");
          return;
        }

        const trHead = el("tr",{}, cols.map(c => el("th",{textContent:c})));
        thead.appendChild(trHead);

        rows.forEach(r => {
          const tr = el("tr",{}, cols.map(c => el("td",{textContent: r[c] ?? ""})));
          tbody.appendChild(tr);
        });
      } catch(err) {
        showMsg(msgDb, "Failed to load table: " + (err.data?.detail || err.message), "error");
      }
    });
  </script>
</body>
</html>
