<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin – Users</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <nav class="navbar">
    <div class="container navbar-inner">
      <a href="index.html" class="brand">
        <span class="brand-logo"></span>
        Myhublogistic
      </a>
      <div class="nav-links">
        <a href="admin-users.html">Users</a>
        <a href="admin-db-view.html">DB View</a>
        <a href="#" onclick="logout();return false;">Logout</a>
      </div>
    </div>
  </nav>

  <div class="container section">
    <div class="card">
      <h3>Add New User</h3>
      <div id="msgCreate"></div>
      <form id="createUserForm" class="grid-2">
        <div class="form-group">
          <label>Email</label>
          <input class="form-control" type="email" id="u_email" required />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input class="form-control" type="password" id="u_password" required />
        </div>
        <div class="form-group">
          <label>Name</label>
          <input class="form-control" type="text" id="u_name" required />
        </div>
        <div class="form-group">
          <label>Company</label>
          <input class="form-control" type="text" id="u_company" />
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input class="form-control" type="text" id="u_phone" />
        </div>
        <div class="form-group">
          <label>Role</label>
          <select class="form-control" id="u_role">
            <option value="client">Client</option>
            <option value="admin">Admin</option>
          </select>
        </div>
        <div class="form-actions" style="grid-column:1/-1;">
          <button class="btn btn-primary" type="submit">Create User</button>
        </div>
      </form>
    </div>

    <div class="card" style="margin-top:20px;">
      <h3>All Users</h3>
      <div id="msgList"></div>
      <div class="table-wrap">
        <table id="usersTable">
          <thead>
            <tr>
              <th>ID</th><th>Email</th><th>Name</th><th>Company</th><th>Phone</th><th>Role</th><th>Created</th><th>Actions</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="assets/app.js"></script>
  <script>
    requireAdmin();
    const createForm = document.getElementById("createUserForm");
    const msgCreate = document.getElementById("msgCreate");
    const msgList = document.getElementById("msgList");
    const tbody = document.querySelector("#usersTable tbody");

    async function loadUsers(){
      tbody.innerHTML = "";
      try {
        const users = await apiRequest("/admin/users");
        users.forEach(u => {
          const editBtn = el("button",{className:"btn btn-glass",textContent:"Edit",type:"button",onclick:()=>editUser(u)});
          const delBtn = el("button",{className:"btn btn-danger",textContent:"Delete",type:"button",onclick:()=>deleteUser(u.id)});
          const actionsTd = el("td",{},[editBtn,delBtn]);
          tbody.appendChild(el("tr",{},[
            el("td",{textContent:u.id}),
            el("td",{textContent:u.email}),
            el("td",{textContent:u.name}),
            el("td",{textContent:u.company_name||"-"}),
            el("td",{textContent:u.phone||"-"}),
            el("td",{textContent:u.role}),
            el("td",{textContent:new Date(u.created_at).toLocaleString()}),
            actionsTd
          ]));
        });
      } catch(err) {
        showMsg(msgList, "Failed to load users: " + (err.data?.detail || err.message), "error");
      }
    }

    async function deleteUser(id){
      if(!confirm("Delete this user?")) return;
      try {
        await apiRequest("/admin/users/" + id, {method:"DELETE"});
        loadUsers();
      } catch(err) {
        alert("Delete failed: " + (err.data?.detail || err.message));
      }
    }

    async function editUser(u){
      const email = prompt("Email:", u.email);
      if (!email) return;
      const name = prompt("Name:", u.name);
      const company_name = prompt("Company:", u.company_name || "");
      const phone = prompt("Phone:", u.phone || "");
      const role = prompt("Role (admin/client):", u.role);
      const password = prompt("New password (leave empty to keep current):", "");

      const payload = {
        email: email.trim(),
        name: name ? name.trim() : "",
        company_name: company_name ? company_name.trim() : "",
        phone: phone ? phone.trim() : "",
        role: (role || "client").trim(),
        password: password ? password.trim() : ""
      };

      try {
        await apiRequest("/admin/users/" + u.id, {
          method:"PUT",
          body: JSON.stringify(payload)
        });
        loadUsers();
      } catch(err) {
        alert("Edit failed: " + (err.data?.detail || err.message));
      }
    }

    createForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      msgCreate.innerHTML = "";
      const payload = {
        email: document.getElementById("u_email").value.trim(),
        password: document.getElementById("u_password").value,
        name: document.getElementById("u_name").value.trim(),
        company_name: document.getElementById("u_company").value.trim(),
        phone: document.getElementById("u_phone").value.trim(),
        role: document.getElementById("u_role").value
      };
      try {
        await apiRequest("/admin/users", {method:"POST", body:JSON.stringify(payload)});
        showMsg(msgCreate, "User created successfully.", "success");
        createForm.reset();
        loadUsers();
      } catch(err) {
        showMsg(msgCreate, "Failed to create user: " + (err.data?.detail||err.message), "error");
      }
    });

    loadUsers();
  </script>
</body>
</html>
