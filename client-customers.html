<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Customers</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <nav class="navbar">
    <div class="container navbar-inner">
      <a href="index.html" class="brand">
        <span class="brand-logo"></span>
        Myhublogistic
      </a>
      <div class="nav-links">
        <a href="client-dashboard.html">Dashboard</a>
        <a href="client-customers.html">Customers</a>
        <a href="client-orders.html">Orders</a>
        <a href="client-shipments.html">Shipments</a>
        <a href="#" onclick="logout();return false;">Logout</a>
      </div>
    </div>
  </nav>

  <div class="container section">
    <div class="card">
      <h3>Add Customer</h3>
      <div id="msgCreate"></div>
      <form id="createCustomerForm" class="grid-2">
        <div class="form-group"><label>Name</label><input class="form-control" type="text" id="c_name" required/></div>
        <div class="form-group"><label>Email</label><input class="form-control" type="email" id="c_email"/></div>
        <div class="form-group"><label>Phone</label><input class="form-control" type="text" id="c_phone"/></div>
        <div class="form-group"><label>City</label><input class="form-control" type="text" id="c_city"/></div>
        <div class="form-group"><label>Country</label><input class="form-control" type="text" id="c_country"/></div>
        <div class="form-group" style="grid-column:1/-1;"><label>Address</label><textarea class="form-control" id="c_address" rows="3"></textarea></div>
        <div class="form-actions" style="grid-column:1/-1;"><button class="btn btn-primary" type="submit">Add Customer</button></div>
      </form>
    </div>

    <div class="card" style="margin-top:20px;">
      <h3>Your Customers</h3>
      <div id="msgList"></div>
      <div class="table-wrap">
        <table id="customersTable">
          <thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>City</th><th>Country</th><th>Actions</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="assets/app.js"></script>
  <script>
    requireAuth();
    const user = getUser();
    const createForm = document.getElementById("createCustomerForm");
    const msgCreate = document.getElementById("msgCreate");
    const msgList = document.getElementById("msgList");
    const tbody = document.querySelector("#customersTable tbody");

    async function loadCustomers(){
      tbody.innerHTML = "";
      try {
        const customers = await apiRequest("/customers");
        customers.forEach(c => {
          const editBtn = el("button",{className:"btn btn-glass",textContent:"Edit",type:"button",onClick:()=>editCustomer(c)});
          const delBtn = el("button",{className:"btn btn-danger",textContent:"Delete",type:"button",onClick:()=>deleteCustomer(c.id)});
          const actionsTd = el("td",{},[editBtn,delBtn]);
          tbody.appendChild(el("tr",{},[
            el("td",{textContent:c.id}),
            el("td",{textContent:c.name}),
            el("td",{textContent:c.email||"-"}),
            el("td",{textContent:c.phone||"-"}),
            el("td",{textContent:c.city||"-"}),
            el("td",{textContent:c.country||"-"}),
            actionsTd
          ]));
        });
      } catch(err) {
        showMsg(msgList, "Failed to load customers: " + err.message);
      }
    }

    async function editCustomer(c){
      const name = prompt("Name:", c.name); if(!name) return;
      const email = prompt("Email:", c.email||"");
      const phone = prompt("Phone:", c.phone||"");
      const city = prompt("City:", c.city||"");
      const country = prompt("Country:", c.country||"");
      const address = prompt("Address:", c.address||"");
      try {
        await apiRequest("/customers/"+c.id, {
          method:"PUT",
          body:JSON.stringify({name,email:email||null,phone:phone||null,city:city||null,country:country||null,address:address||null})
        });
        loadCustomers();
      } catch(err) {
        alert("Edit failed: " + (err.data?.detail||err.message));
      }
    }

    async function deleteCustomer(id){
      if(!confirm("Delete this customer?")) return;
      try {
        await apiRequest("/customers/"+id, {method:"DELETE"});
        loadCustomers();
      } catch(err) {
        alert("Delete failed: " + (err.data?.detail||err.message));
      }
    }

    createForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      msgCreate.innerHTML = "";
      const payload = {
        user_id: user.id,
        name: document.getElementById("c_name").value.trim(),
        email: document.getElementById("c_email").value.trim(),
        phone: document.getElementById("c_phone").value.trim(),
        address: document.getElementById("c_address").value.trim(),
        city: document.getElementById("c_city").value.trim(),
        country: document.getElementById("c_country").value.trim()
      };
      try {
        await apiRequest("/customers", {method:"POST", body:JSON.stringify(payload)});
        showMsg(msgCreate, "Customer added successfully.", "success");
        createForm.reset();
        loadCustomers();
      } catch(err) {
        showMsg(msgCreate, "Failed to add customer: " + (err.data?.detail||err.message));
      }
    });

    loadCustomers();
  </script>
</body>
</html>
